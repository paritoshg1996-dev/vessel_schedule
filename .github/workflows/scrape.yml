name: Scrape JNPT vessel schedule

on:
  schedule:
    # Fixed 4x/day: 2am, 6am, noon, 6pm IST (a deliberate choice -- see
    # docs/reliability_notes.md for the full write-up, superseding the
    # hourly attempt this repo tried first). GitHub Actions cron always
    # runs in UTC with no timezone conversion, and IST is UTC+5:30, so
    # each of those 4 IST clock times is :30-past-the-hour in UTC:
    #   02:00 IST -> 20:30 UTC (previous day)
    #   06:00 IST -> 00:30 UTC
    #   12:00 IST -> 06:30 UTC
    #   18:00 IST -> 12:30 UTC
    # A side benefit of IST's own 5:30 offset: every one of these lands
    # on a UTC half-hour, never the top of a UTC hour -- the single
    # worst time to be queued, per GitHub's own docs -- for free.
    #
    # IMPORTANT caveat, confirmed by directly pulling this repo's own
    # run history (2026-09-15): moving to hourly did NOT, by itself, fix
    # real-world staleness. GitHub's `schedule:` trigger is best-effort
    # and can silently skip a scheduled tick under load with no error,
    # no retry, and no record that anything was supposed to run --
    # observed gaps between actual runs stayed multi-hour (2.95h-8.33h)
    # even AFTER switching to an hourly cron, because most of the hourly
    # ticks never fired at all. This 4x/day schedule is a deliberate,
    # explicitly-accepted cadence (not a workaround for that problem) --
    # but the same silent-skip risk still applies to whichever 4 ticks
    # are scheduled here. If a fully reliable "definitely ran at this
    # exact time" guarantee is ever needed, that requires a trigger
    # outside GitHub's own scheduler entirely (e.g. an external cron
    # service calling this workflow's `workflow_dispatch` API on its own
    # clock) -- not implemented, since it needs a repo-scoped GitHub
    # token held outside this repo. See reliability_notes.md.
    - cron: '30 0,6,12,20 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed to commit the refreshed data.json back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --- Database ---------------------------------------------------
      # Recommended: point DATABASE_URL (repo secret) at a small hosted
      # Postgres instance (Supabase, Neon, and Railway all have free
      # tiers big enough for this). That gives you a DB that persists
      # across runs on GitHub's ephemeral runners, and is a one-line
      # change since models.py/run_pipeline.py already speak SQLAlchemy.
      #
      # If DATABASE_URL isn't set, the pipeline falls back to a fresh
      # local SQLite file every run. That's fine for "what's the
      # schedule right now" (frontend/data.json still comes out correct
      # each run) but you lose first_seen_at history and cross-run
      # dedup, since nothing persists between runs. Uncomment the cache
      # step below if you want SQLite to persist without standing up
      # Postgres.
      #
      # - name: Restore SQLite cache
      #   uses: actions/cache@v4
      #   with:
      #     path: vessel_schedule.db
      #     key: vessel-schedule-db-${{ github.run_id }}
      #     restore-keys: vessel-schedule-db-

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional: also mirror vessel_schedule/berthed_vessels into a
          # MongoDB database for a separate app backend to serve over its
          # own API (see pipeline/mongo_export.py). Omit both secrets to
          # skip this entirely -- the SQL/data.json output isn't affected
          # either way.
          MONGO_URL: ${{ secrets.MONGO_URL }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
          ADMIN_ALERT_SLACK_WEBHOOK_URL: ${{ secrets.ADMIN_ALERT_SLACK_WEBHOOK_URL }}
          ADMIN_ALERT_EMAIL_TO: ${{ secrets.ADMIN_ALERT_EMAIL_TO }}
          ADMIN_ALERT_SMTP_HOST: ${{ secrets.ADMIN_ALERT_SMTP_HOST }}
          ADMIN_ALERT_SMTP_PORT: ${{ secrets.ADMIN_ALERT_SMTP_PORT }}
          ADMIN_ALERT_SMTP_USER: ${{ secrets.ADMIN_ALERT_SMTP_USER }}
          ADMIN_ALERT_SMTP_PASSWORD: ${{ secrets.ADMIN_ALERT_SMTP_PASSWORD }}
        run: python run_pipeline.py

      - name: Commit refreshed data.json
        run: |
          git config user.name "vessel-schedule-bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/data.json
          git diff --cached --quiet || git commit -m "Refresh vessel schedule data [skip ci]"
          # A manual trigger overlapping with another push (or another run)
          # can leave main ahead of what this job started from -- rebase
          # our one-file data commit on top rather than failing outright.
          git pull --rebase origin main
          git push
